<div class="min-h-screen bg-stone-100 flex flex-col items-center justify-between py-8">
  <!-- Skip Button -->
  <button 
    (click)="skipOnboarding()" 
    class="fixed top-4 right-4 text-stone-600 hover:text-stone-700 text-sm font-medium underline z-50"
  >
    Skip
  </button>

  <!-- Slide Content -->
  <div class="flex-1 flex items-center justify-center w-full px-4">
    <div class="max-w-md w-full text-center" [@slide]="currentSlide">
      <img 
        [src]="slides[currentSlide].image" 
        [alt]="slides[currentSlide].title" 
        (error)="slides[currentSlide].image = slides[currentSlide].fallbackImage"
        class="w-full max-h-96 object-contain rounded-lg mb-6 mx-auto"
      >
      <h2 class="text-2xl font-serif text-stone-700">{{ slides[currentSlide].title }}</h2>
      <p class="mt-4 text-stone-500">{{ slides[currentSlide].description }}</p>
    </div>
  </div>

  <!-- Navigation Controls -->
  <div class="flex flex-col items-center mb-8">
    <!-- Dots -->
    <div class="flex space-x-2 mb-4">
      <span 
        *ngFor="let slide of slides; let i = index" 
        class="w-3 h-3 rounded-full" 
        [class.bg-stone-600]="i === currentSlide"
        [class.bg-stone-300]="i !== currentSlide"
      ></span>
    </div>

    <!-- Arrows (for desktop) -->
    <div class="flex space-x-4">
      <button 
        *ngIf="currentSlide > 0" 
        (click)="prevSlide()" 
        class="px-4 py-2 bg-stone-600 text-white rounded-lg hover:bg-stone-700 transition-colors"
      >
        Previous
      </button>
      <button 
        (click)="nextSlide()" 
        class="px-4 py-2 bg-stone-600 text-white rounded-lg hover:bg-stone-700 transition-colors"
      >
        {{ currentSlide < slides.length - 1 ? 'Next' : 'Get Started' }}
      </button>
    </div>
  </div>
</div>
